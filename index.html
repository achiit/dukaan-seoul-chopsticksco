<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seoulchopsticksco | Korean Food & Bubble Tea in Varanasi</title>
<meta name="description" content="Korean fried chicken, Dak Galbi, Cheese Buldak, momos, pasta and bubble tea at Padamshree Chauraha, Bhelupur, Varanasi. Call or WhatsApp to order.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16100d; --ink2:#241a15; --cream:#f6ecdc; --beige:#e4d3b8; --red:#c2262e; --red-d:#8f1a21;
  --pink:#f2b8b0; --mint:#b9d8c8; --neon:#ff4d6d;
  --display:'Dela Gothic One','Arial Black',Impact,sans-serif;
  --body:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{font-family:var(--body);background:var(--ink);color:var(--cream);line-height:1.55;padding-bottom:76px}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1}
h2{font-size:clamp(28px,6vw,44px);margin-bottom:6px}
.sub{color:var(--beige);opacity:.8;margin-bottom:24px;max-width:56ch}
section{padding:56px 0}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(22,16,13,.94);backdrop-filter:blur(8px);border-bottom:1px solid #3a2c24}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:var(--display);font-size:17px;text-decoration:none;color:var(--cream)}
.logo span{color:var(--neon)}
nav ul{display:none;list-style:none;gap:22px;font-weight:500;font-size:15px}
nav ul a{text-decoration:none;opacity:.85}
nav ul a:hover{opacity:1;color:var(--neon)}
@media(min-width:760px){nav ul{display:flex}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;border:2px solid transparent;cursor:pointer;font-family:var(--body);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-red{background:var(--red);color:#fff}
.btn-wa{background:#25d366;color:#08210f}
.btn-line{border-color:var(--cream);color:var(--cream)}
.btn-line:hover{background:var(--cream);color:var(--ink)}

/* hero */
.hero{padding:36px 0 56px;background:radial-gradient(circle at 85% 10%,rgba(194,38,46,.45),transparent 45%),var(--ink)}
.hero .wrap{display:grid;gap:28px}
.hero h1{font-size:clamp(40px,11vw,86px);letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--neon);text-shadow:0 0 24px rgba(255,77,109,.55)}
.hero p.lead{font-size:18px;color:var(--beige);max-width:44ch;margin:14px 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-img{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:4/5;border:2px solid var(--red)}
.hero-img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:14px;bottom:14px;background:var(--cream);color:var(--ink);border-radius:18px;padding:10px 14px;max-width:80%}
.badge b{display:block;font-family:var(--display);font-weight:400;font-size:18px;color:var(--red)}
.badge small{font-size:13px}
@media(min-width:800px){.hero .wrap{grid-template-columns:1.15fr .85fr;align-items:center}}

/* best seller */
.best{background:var(--red);color:#fff;padding:36px 0}
.best .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.best h2{font-size:clamp(26px,5vw,38px)}
.best p{max-width:48ch;opacity:.92}
.price-big{font-family:var(--display);font-size:42px}

/* menu */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;position:sticky;top:56px;z-index:10;background:var(--ink);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 18px;border-radius:999px;border:1.5px solid #5a463a;background:transparent;color:var(--cream);font:600 15px var(--body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.panel{display:none}
.panel.on{display:block}
.group{margin-bottom:28px}
.group h3{font-size:20px;color:var(--pink);margin:20px 0 4px}
.group .note{font-size:14px;color:var(--beige);opacity:.75;margin-bottom:6px}
.item{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px dashed #4a3a31}
.item .nm{flex:1;font-weight:500}
.item .nm small{display:block;font-weight:400;font-size:13.5px;color:var(--beige);opacity:.75}
.item .pr{font-weight:700;white-space:nowrap;text-align:right}
.item .pr span{display:block;font-weight:400;font-size:12px;opacity:.7}
.tag{display:inline-block;background:var(--neon);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.ord{flex:none;width:34px;height:34px;border-radius:50%;background:#25d366;color:#08210f;display:grid;place-items:center;text-decoration:none;font-weight:700;font-size:20px;line-height:1;align-self:center}
.hint{font-size:14px;color:var(--beige);opacity:.8;margin-top:6px}

/* gallery */
.gallery{background:var(--ink2)}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid img{width:100%;height:100%;object-fit:cover;border-radius:18px;aspect-ratio:3/4}
.grid .wide{grid-column:span 2}
.grid .wide img{aspect-ratio:16/9}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.grid .wide{grid-column:span 2}}

/* visit */
.visit .wrap{display:grid;gap:28px}
.card{background:var(--cream);color:var(--ink);border-radius:24px;padding:26px}
.card h3{font-size:24px;color:var(--red);margin-bottom:12px}
.card p{margin-bottom:10px}
.card .cta{margin-top:14px}
.card .btn-line{border-color:var(--ink);color:var(--ink)}
.card .btn-line:hover{background:var(--ink);color:var(--cream)}
.mapbox{border-radius:24px;overflow:hidden;min-height:300px;border:2px solid #3a2c24}
.mapbox iframe{width:100%;height:100%;min-height:300px;border:0;filter:grayscale(.3)}
@media(min-width:800px){.visit .wrap{grid-template-columns:1fr 1fr}}

footer{padding:28px 0 20px;text-align:center;font-size:14px;color:var(--beige);opacity:.75}

/* sticky order bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(22,16,13,.96);border-top:1px solid #3a2c24}
.bar .btn{flex:1;padding:12px 8px;font-size:15px}
@media(min-width:900px){.bar{display:none}body{padding-bottom:0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn{transition:none}}

/* menu rows with variants + stepper */
.item{align-items:center}
.vars{display:flex;flex-direction:column;gap:6px;min-width:170px}
.vrow{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.vl{font-size:13px;color:var(--beige);opacity:.85;flex:1;text-align:right}
.vrow .pr{min-width:44px}
.ctl{display:inline-flex;min-width:92px;justify-content:flex-end}
.add{border:0;border-radius:999px;background:#25d366;color:#08210f;font:700 14px var(--body);padding:7px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.add.ask{background:transparent;border:1.5px solid var(--beige);color:var(--beige)}
.qty{display:inline-flex;align-items:center;background:var(--cream);color:var(--ink);border-radius:999px;overflow:hidden}
.qty button{width:34px;height:32px;border:0;background:transparent;font:700 20px var(--body);cursor:pointer;color:var(--ink)}
.qty button:active{background:var(--beige)}
.qty span{min-width:22px;text-align:center;font-weight:700}
/* cart */
.navcart{position:relative;background:transparent;border:1.5px solid var(--cream);color:var(--cream);border-radius:999px;padding:7px 14px;font:600 14px var(--body);cursor:pointer;margin-left:8px}
.navcart b{position:absolute;top:-7px;right:-6px;background:var(--neon);color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:99px;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;left:12px;right:12px;bottom:68px;z-index:35;border:0;border-radius:16px;background:var(--neon);color:#fff;font:700 16px var(--body);padding:14px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.45)}
@media(min-width:900px){.fab{left:auto;right:24px;bottom:24px;width:auto;padding:14px 24px}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;z-index:50;background:var(--cream);color:var(--ink);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s}
.sheet.open{transform:none}
@media(min-width:700px){.sheet{left:auto;right:24px;bottom:24px;width:440px;border-radius:24px}}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 8px}
.sh-head h3{font-size:24px;color:var(--red)}
.sh-head button{border:0;background:transparent;font-size:30px;line-height:1;cursor:pointer;color:var(--ink)}
.sh-body{overflow-y:auto;padding:0 20px;flex:1}
.cl{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px dashed #cdb99a;list-style:none}
.cn small{display:block;font-size:13px;opacity:.7}
.lt{font-weight:700;min-width:52px;text-align:right}
.rm{border:0;background:transparent;font-size:22px;color:var(--red-d);cursor:pointer}
.sheet .qty{background:var(--ink);color:var(--cream)}
.sheet .qty button{color:var(--cream)}
.sh-foot{padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--ink)}
.sh-foot input,.sh-foot textarea{width:100%;border:1.5px solid #b9a27f;border-radius:12px;padding:10px 12px;font:16px var(--body);background:#fff9ee;margin-bottom:8px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:6px 0 12px}
.sh-foot .btn{width:100%}
.link{background:none;border:0;color:var(--red-d);font:600 14px var(--body);text-decoration:underline;cursor:pointer;margin-top:8px}
@media(prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.mcard{margin-top:36px}
.mcard h3{font-size:22px;color:var(--pink);margin-bottom:4px}
.mcard a{display:block;border-radius:18px;overflow:hidden;border:2px solid #3a2c24;margin-top:12px}
.mcard img{width:100%;height:auto}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:12px;overflow:auto}
.lb.open{display:flex}
.lb img{max-width:none;width:min(1400px,200vw);height:auto;border-radius:8px}
@media(min-width:900px){.lb img{width:min(1100px,100%)}}
.lbx{position:fixed;top:10px;right:14px;z-index:61;border:0;background:var(--cream);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:26px;cursor:pointer;display:none}
.lb.open+.lbx{display:block}
</style>
</head>
